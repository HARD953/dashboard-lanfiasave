      <circle cx="160" cy="174" r="2" fill="#111"/>
      <circle cx="174" cy="174" r="2" fill="#111"/>
      <path d="M161 183 C165 187 170 187 174 183" stroke="#2E1A0C" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M192 236 C214 244 228 252 240 262" stroke="#0B1F3A" stroke-width="13" stroke-linecap="round" fill="none"/>
