<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="t">
  <title id="t">Remise d'un kit d'aide à une famille sur un site d'accueil, avec reçu signé</title>
  <defs><clipPath id="f"><rect width="520" height="400" rx="32"/></clipPath></defs>
